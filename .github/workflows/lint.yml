name: Lint

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-scope:
    uses: ./.github/workflows/change-scope.yml

  miniapp:
    needs: lint-scope
    if: contains(fromJSON('["ui", "ui-backend", "full"]'), needs.lint-scope.outputs.mode)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: miniapp
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - name: Check Mini App source and packaged assets
        run: |
          npx --yes pnpm@9.15.9 install --frozen-lockfile --ignore-scripts
          npm run typecheck
          npm test
          npm run build -- --outDir "$RUNNER_TEMP/lint-miniapp-dist"
          bash ../scripts/validate-miniapp-dist.sh "$RUNNER_TEMP/lint-miniapp-dist"
          bash ../scripts/validate-miniapp-dist.sh dist

  jvm:
    needs: lint-scope
    if: contains(fromJSON('["backend", "ui-backend", "full"]'), needs.lint-scope.outputs.mode)
    uses: ./.github/workflows/tests.yml

  pr-image:
    needs: lint-scope
    if: github.event_name == 'pull_request' && needs.lint-scope.outputs.image == 'true'
    uses: ./.github/workflows/docker-image.yml

  container-smoke:
    needs: lint-scope
    if: needs.lint-scope.outputs.image == 'true'
    uses: ./.github/workflows/container-smoke.yml

  lint-core:
    name: lint-core
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: lint-scope
    if: contains(fromJSON('["backend", "ui-backend", "full"]'), needs.lint-scope.outputs.mode)
    concurrency:
      group: lint-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b36c23c0d998641eff861008f374ee103c25ac73 # v4.4.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle cache & setup
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
        with:
          cache-disabled: false
          gradle-version: wrapper
          cache-read-only: false

      - name: Validate payment hardening structure
        if: needs.lint-scope.outputs.mode != 'full'
        run: python3 -B scripts/validate-payment-hardening.py .

      - name: Payment hardening required runtime
        run: |
          python3 scripts/validate-payment-hardening.py \
            --run-required-runtime \
            .

      - name: Quality gate regression self-check
        run: ./scripts/selfcheck-quality-gates.sh --ci-delegated-release-state-and-corrected-stage
        if: needs.lint-scope.outputs.mode == 'full'

  corrected-authority:
    name: corrected-authority
    needs: lint-scope
    if: needs.lint-scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: lint-corrected-authority-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Python 3.11+
        run: |
          python3 - <<'PY'
          import sys

          if sys.version_info < (3, 11):
              raise SystemExit(f"Python 3.11+ required; got {sys.version.split()[0]}")
          print(f"corrected-stage-python: {sys.version.split()[0]}")
          PY

      - name: Run complete corrected-stage shard
        run: python3 -B scripts/run-corrected-stage-shard.py authority

  corrected-executor:
    name: corrected-executor
    needs: lint-scope
    if: needs.lint-scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: lint-corrected-executor-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Python 3.11+
        run: |
          python3 - <<'PY'
          import sys

          if sys.version_info < (3, 11):
              raise SystemExit(f"Python 3.11+ required; got {sys.version.split()[0]}")
          print(f"corrected-stage-python: {sys.version.split()[0]}")
          PY

      - name: Run complete corrected-stage shard
        run: python3 -B scripts/run-corrected-stage-shard.py executor

  corrected-import-root:
    name: corrected-import-root
    needs: lint-scope
    if: needs.lint-scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: lint-corrected-import-root-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Python 3.11+
        run: |
          python3 - <<'PY'
          import sys

          if sys.version_info < (3, 11):
              raise SystemExit(f"Python 3.11+ required; got {sys.version.split()[0]}")
          print(f"corrected-stage-python: {sys.version.split()[0]}")
          PY

      - name: Run complete corrected-stage shard
        run: python3 -B scripts/run-corrected-stage-shard.py import-root

  corrected-support:
    name: corrected-support
    needs: lint-scope
    if: needs.lint-scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: lint-corrected-support-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Python 3.11+
        run: |
          python3 - <<'PY'
          import sys

          if sys.version_info < (3, 11):
              raise SystemExit(f"Python 3.11+ required; got {sys.version.split()[0]}")
          print(f"corrected-stage-python: {sys.version.split()[0]}")
          PY

      - name: Run complete corrected-stage shard
        run: python3 -B scripts/run-corrected-stage-shard.py support

  lint:
    name: lint
    if: always()
    needs: [lint-scope, miniapp, jvm, pr-image, container-smoke, lint-core, corrected-authority, corrected-executor, corrected-import-root, corrected-support]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lint worker to succeed
        env:
          LINT_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          shards = {"corrected-authority", "corrected-executor", "corrected-import-root", "corrected-support"}
          needs = json.loads(os.environ["LINT_NEEDS_JSON"])
          scope = needs["lint-scope"]
          mode = scope["outputs"]["mode"]
          image = scope["outputs"]["image"]
          if mode not in ("docs", "ui", "backend", "ui-backend", "full") or image not in ("true", "false"):
              raise SystemExit("lint gate: invalid change scope")
          backend = mode in ("backend", "ui-backend", "full")
          if (backend and image != "true") or (mode == "docs" and image != "false"):
              raise SystemExit("lint gate: inconsistent packaging scope")
          required = {
              "lint-scope": True,
              "miniapp": mode in ("ui", "ui-backend", "full"),
              "lint-core": backend,
              "jvm": backend,
              "container-smoke": image == "true",
              "pr-image": image == "true" and os.environ["GITHUB_EVENT_NAME"] == "pull_request",
              **{shard: mode == "full" for shard in shards},
          }
          if set(needs) != set(required):
              raise SystemExit("lint gate: missing or unexpected worker")
          for name, applies in required.items():
              if needs[name]["result"] != ("success" if applies else "skipped"):
                  raise SystemExit(f"lint gate: unexpected result for {name}")
          print("lint gate: required workers succeeded for", mode)
          PY
