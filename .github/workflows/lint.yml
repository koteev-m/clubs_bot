name: Lint

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-core:
    name: lint-core
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: lint-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b36c23c0d998641eff861008f374ee103c25ac73 # v4.4.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle cache & setup
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
        with:
          cache-disabled: false
          gradle-version: wrapper
          cache-read-only: false

      - name: Payment hardening required runtime
        run: |
          python3 scripts/validate-payment-hardening.py \
            --run-required-runtime \
            .

      - name: Quality gate regression self-check
        run: ./scripts/selfcheck-quality-gates.sh --ci-delegated-release-state-and-corrected-stage

      - name: Run detekt gate (blocking, baseline-aware)
        run: ./gradlew detektGate --console=plain --stacktrace

      - name: Run ktlint gate (baseline-aware; Kotlin changes only)
        env:
          VERIFY_TO_SHA: ${{ github.sha }}
          VERIFY_FROM_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/ktlint-changed.sh

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: lint-reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/ktlint/**
          if-no-files-found: ignore

  corrected-authority:
    name: corrected-authority
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: lint-corrected-authority-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Python 3.11+
        run: |
          python3 - <<'PY'
          import sys

          if sys.version_info < (3, 11):
              raise SystemExit(f"Python 3.11+ required; got {sys.version.split()[0]}")
          print(f"corrected-stage-python: {sys.version.split()[0]}")
          PY

      - name: Run complete corrected-stage shard
        run: python3 -B scripts/run-corrected-stage-shard.py authority

  corrected-executor:
    name: corrected-executor
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: lint-corrected-executor-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Python 3.11+
        run: |
          python3 - <<'PY'
          import sys

          if sys.version_info < (3, 11):
              raise SystemExit(f"Python 3.11+ required; got {sys.version.split()[0]}")
          print(f"corrected-stage-python: {sys.version.split()[0]}")
          PY

      - name: Run complete corrected-stage shard
        run: python3 -B scripts/run-corrected-stage-shard.py executor

  corrected-import-root:
    name: corrected-import-root
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: lint-corrected-import-root-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Python 3.11+
        run: |
          python3 - <<'PY'
          import sys

          if sys.version_info < (3, 11):
              raise SystemExit(f"Python 3.11+ required; got {sys.version.split()[0]}")
          print(f"corrected-stage-python: {sys.version.split()[0]}")
          PY

      - name: Run complete corrected-stage shard
        run: python3 -B scripts/run-corrected-stage-shard.py import-root

  corrected-support:
    name: corrected-support
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: lint-corrected-support-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Python 3.11+
        run: |
          python3 - <<'PY'
          import sys

          if sys.version_info < (3, 11):
              raise SystemExit(f"Python 3.11+ required; got {sys.version.split()[0]}")
          print(f"corrected-stage-python: {sys.version.split()[0]}")
          PY

      - name: Run complete corrected-stage shard
        run: python3 -B scripts/run-corrected-stage-shard.py support

  lint:
    name: lint
    if: always()
    needs: [lint-core, corrected-authority, corrected-executor, corrected-import-root, corrected-support]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lint worker to succeed
        env:
          LINT_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          expected = {"lint-core", "corrected-authority", "corrected-executor", "corrected-import-root", "corrected-support"}
          needs = json.loads(os.environ["LINT_NEEDS_JSON"])
          if not isinstance(needs, dict) or set(needs) != expected:
              raise SystemExit("lint gate: missing or unexpected worker")
          failed = [name for name in sorted(expected) if not isinstance(needs[name], dict) or needs[name].get("result") != "success"]
          if failed:
              raise SystemExit("lint gate: workers did not succeed: " + ", ".join(failed))
          print("lint gate: every mandatory worker succeeded")
          PY

  release-state:
    name: release-state
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: release-state-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Python 3.11+
        run: |
          python3 - <<'PY'
          import sys

          if sys.version_info < (3, 11):
              raise SystemExit(f"Python 3.11+ required; got {sys.version.split()[0]}")
          print(f"release-state-python: {sys.version.split()[0]}")
          PY

      - name: Validate release-state structure
        run: ./scripts/validate-quiesced-deployment.sh .

      - name: Run strict release-state suite
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/tests/test_quiesced_release_state.py --strict-ci
