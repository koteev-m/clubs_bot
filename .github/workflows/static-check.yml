name: static-check
on:
  pull_request:
  push:
    branches: [ main, master ]
permissions:
  contents: read
  security-events: write
jobs:
  detekt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: actions/setup-java@b36c23c0d998641eff861008f374ee103c25ac73 # v4.4.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Gradle cache & setup
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
        with:
          cache-disabled: false
          gradle-version: wrapper
          cache-read-only: false
          cache-key-prefix: >
            ${{ runner.os }}-gradle-
            ${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml', 'settings.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Prepare Detekt SARIF
        run: ./gradlew prepareDetektSarif --no-configuration-cache --console=plain
      - name: Run detekt
        run: ./gradlew detekt --continue --no-configuration-cache --console=plain
      - name: Finalize Detekt SARIF manifest
        if: always()
        run: ./gradlew finalizeDetektSarifManifest --no-configuration-cache --console=plain
      - name: Collect Detekt SARIF
        id: detekt-sarif-collector
        if: always()
        run: python3 scripts/merge-detekt-sarif.py --manifest build/reports/detekt/expected-sarif.json --output build/reports/detekt/combined/detekt.sarif
      - name: Upload detekt HTML report
        if: ${{ always() && hashFiles('**/build/reports/detekt/detekt*/detekt.html') != '' }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: detekt-html
          path: "**/build/reports/detekt/detekt*/detekt.html"
          if-no-files-found: error
      - name: Upload detekt SARIF to Code Scanning
        if: ${{ always() && steps.detekt-sarif-collector.outcome == 'success' && hashFiles('build/reports/detekt/combined/detekt.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@7c9a7896f03bb1f3de14c5663ed46759e27443e0 # v4.31.9
        with:
          sarif_file: build/reports/detekt/combined/detekt.sarif
