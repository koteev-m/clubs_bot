name: Secret Scan

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  lint-scope:
    permissions:
      contents: read
    uses: ./.github/workflows/change-scope.yml

  # These analyses retain their existing SARIF upload permissions.
  security-analysis:
    uses: ./.github/workflows/security-scan.yml

  static-analysis:
    uses: ./.github/workflows/static-check.yml

  gitleaks:
    concurrency:
      group: secret-scan-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0

      - name: Load quality gate tool versions
        run: cat scripts/quality-gates.env >> "$GITHUB_ENV"

      - name: Run gitleaks (blocking)
        env:
          SECRET_SCAN_OUTPUT_DIR: ${{ runner.temp }}/clb-secret-scan
        run: bash scripts/verify.sh secret-scan

      - name: Upload gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@7c9a7896f03bb1f3de14c5663ed46759e27443e0 # v4.31.9
        with:
          sarif_file: ${{ runner.temp }}/clb-secret-scan

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/clb-secret-scan
          if-no-files-found: error

  release-state:
    name: release-state
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: [lint-scope, gitleaks, security-analysis, static-analysis]
    permissions:
      contents: read
    if: always()
    concurrency:
      group: release-state-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false

    steps:
      - name: Require verified change range and security checks
        env:
          SCOPE_RESULT: ${{ needs.lint-scope.result }}
          MODE: ${{ needs.lint-scope.outputs.mode }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          SECURITY: ${{ needs.security-analysis.result }}
          STATIC: ${{ needs.static-analysis.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$GITLEAKS" = success
          test "$SECURITY" = success
          test "$STATIC" = success
          case "$MODE" in docs|ui|backend|ui-backend|full) ;; *) exit 1 ;; esac

      - name: Checkout exact candidate
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Python 3.11+
        run: |
          python3 - <<'PY'
          import sys

          if sys.version_info < (3, 11):
              raise SystemExit(f"Python 3.11+ required; got {sys.version.split()[0]}")
          print(f"release-state-python: {sys.version.split()[0]}")
          PY

      - name: Validate release-state structure
        run: ./scripts/validate-quiesced-deployment.sh .

      - name: Run strict release-state suite
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/tests/test_quiesced_release_state.py --strict-ci
        if: needs.lint-scope.outputs.mode == 'full'
