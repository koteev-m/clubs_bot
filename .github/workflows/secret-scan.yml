name: Secret Scan

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0

      - name: Load quality gate tool versions
        run: cat scripts/quality-gates.env >> "$GITHUB_ENV"

      - name: Run gitleaks (blocking)
        env:
          SECRET_SCAN_OUTPUT_DIR: ${{ runner.temp }}/clb-secret-scan
        run: bash scripts/verify.sh secret-scan

      - name: Upload gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@7c9a7896f03bb1f3de14c5663ed46759e27443e0 # v4.31.9
        with:
          sarif_file: ${{ runner.temp }}/clb-secret-scan

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/clb-secret-scan
          if-no-files-found: error
