name: Change scope

on:
  workflow_call:
    outputs:
      mode:
        value: ${{ jobs.changes.outputs.mode }}
      image:
        value: ${{ jobs.changes.outputs.image }}
      quality_controls:
        value: ${{ jobs.changes.outputs.quality_controls }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.range.outputs.mode }}
      image: ${{ steps.range.outputs.image }}
      quality_controls: ${{ steps.range.outputs.quality_controls }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine change range
        id: range
        env:
          LINT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          LINT_CANDIDATE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_REF" == refs/tags/* || ( "$GITHUB_EVENT_NAME" == push && "$LINT_BASE" == 0000000000000000000000000000000000000000 ) ]]; then
            printf '%s\n' mode=full image=true quality_controls=true >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$LINT_BASE" "$GITHUB_SHA" -- scripts/lint-scope.py; then
            python3 -I -S -B scripts/lint-scope.py >> "$GITHUB_OUTPUT"
          else
            status=$?
            [[ "$status" == 1 ]] || exit "$status"
            printf '%s\n' mode=full image=true quality_controls=true >> "$GITHUB_OUTPUT"
          fi

      - name: Require a recognized suite
        env:
          MODE: ${{ steps.range.outputs.mode }}
          IMAGE: ${{ steps.range.outputs.image }}
          QUALITY: ${{ steps.range.outputs.quality_controls }}
        run: |
          case "$MODE/$IMAGE/$QUALITY" in
            docs/false/false|ui/false/false|ui/true/false|full/true/true) ;;
            backend/true/true|backend/true/false|ui-backend/true/true|ui-backend/true/false) ;;
            *) echo 'Missing or inconsistent change scope' >&2; exit 1 ;;
          esac
