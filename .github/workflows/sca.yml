name: SCA Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep this job id for required-check compatibility: SCA Gate / dependency-check.
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b36c23c0d998641eff861008f374ee103c25ac73 # v4.4.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle cache & setup
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-disabled: false
          gradle-version: wrapper
          cache-read-only: true

      - name: Verify resolved production dependency graph (blocking)
        run: >-
          ./gradlew verifyResolvedProductionDependencyGraph
          --dependency-verification=strict
          --no-configuration-cache
          --console=plain
