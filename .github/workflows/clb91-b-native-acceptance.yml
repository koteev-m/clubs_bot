---
name: CLB-91 B Native Acceptance
'on':
  workflow_dispatch:
    inputs:
      approved_revision:
        description: Exact published commit independently approved for this single native run
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: clb91-b-native-acceptance-single-v1
  cancel-in-progress: false
jobs:
  native:
    if: >-
      github.repository == 'koteev-m/clubs_bot' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.actor == 'koteev-m' &&
      github.triggering_actor == 'koteev-m' &&
      github.sha == inputs.approved_revision
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout exact approved revision
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      with:
        ref: "${{ inputs.approved_revision }}"
        persist-credentials: false
    - name: One source-bound synthetic native operation
      id: acceptance
      shell: bash
      env:
        CLB91_APPROVED_REVISION: "${{ inputs.approved_revision }}"
        CLB91_B_NATIVE_APPROVAL: "${{ vars.CLB91_B_NATIVE_APPROVAL }}"
        RUNNER_ENVIRONMENT: "${{ runner.environment }}"
      run: /usr/bin/python3 -I -S -B scripts/tests/linux-semantic/b-launch/workflow-driver.py
    - name: Upload only validated bounded evidence
      if: "${{ !cancelled() && steps.acceptance.outputs.evidence == 'validated' }}"
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
      with:
        name: clb91-b-native-evidence
        path: clb91-b-native-result.json
        retention-days: 3
        if-no-files-found: error
