name: Deploy (quiesced SSH release)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "stage"
        type: choice
        options: [ "stage", "prod" ]
      image_tag:
        description: "Published app-bot image tag for this Git revision"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: payments-schema-${{ github.event_name == 'push' && 'prod' || inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'push' && 'prod' || inputs.environment }}
    env:
      APP_ENV: ${{ github.event_name == 'push' && 'prod' || inputs.environment }}
      FLYWAY_MODE: migrate-and-validate
      GRADLE_OPTS: "-Dorg.gradle.daemon=true -Dorg.gradle.parallel=false -Dorg.gradle.caching=true"

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Gradle wrapper validate
        uses: gradle/wrapper-validation-action@460a3ca55fc5d559238a0efc7fa9f7465df8585d # v3.3.0

      - name: Setup JDK 21
        uses: actions/setup-java@b36c23c0d998641eff861008f374ee103c25ac73 # v4.4.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Gradle cache and setup
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
        with:
          cache-disabled: false
          gradle-version: wrapper
          cache-read-only: false

      - name: Derive immutable release inputs
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" =~ ^v.* ]]; then
            image_tag="${GITHUB_REF_NAME}"
          else
            image_tag="${{ inputs.image_tag }}"
          fi
          test -n "$image_tag"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -p "${{ secrets.SSH_PORT || '22' }}" "${{ secrets.SSH_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Quiesce, migrate and start verified image
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          COMPOSE_PATH: ${{ secrets.COMPOSE_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/app-bot
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          EXPECTED_REVISION: ${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: scripts/deploy/quiesced-release.sh

      - name: Done
        run: echo "Quiesced release complete for ${APP_ENV}"
