name: Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=60000"

    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - &guard-no-dynamic-versions
        name: "Guard: no dynamic dependency versions"
        run: |
          set -euo pipefail
          files=$(git ls-files '**/*.gradle' '**/*.gradle.kts' 'settings.gradle' 'settings.gradle.kts' || true)
          [ -z "$files" ] && exit 0

          violations=0
          tmp="$(mktemp)"
          for f in $files; do
            sed -E ':a;/\/\*/{N;/\*\//!ba;s/\/\*.*\*\///g}; s,//.*$,,' "$f" > "$tmp"

            if grep -nE "version[[:space:]]*=[[:space:]]*[\"'][^\"']*\+[\"']" "$tmp"; then
              echo "::error file=$f::Dynamic version (+) is not allowed in $f"
              violations=1
            fi

            if grep -nE ":[^:@\"']*\+[\"']" "$tmp"; then
              echo "::error file=$f::Dependency coordinates must be pinned (found '+')"
              violations=1
            fi

            if grep -nE "['\"][[:alnum:].-]*latest\.(release|integration)['\"]" "$tmp"; then
              echo "::error file=$f::latest.release/latest.integration are forbidden"
              violations=1
            fi

            if grep -nE "['\"][^'\"]*-SNAPSHOT['\"]" "$tmp"; then
              echo "::error file=$f::-SNAPSHOT versions are not allowed"
              violations=1
            fi

            if grep -nE "['\"]\[[^'\"]+[\)\]]['\"]" "$tmp"; then
              echo "::error file=$f::Version ranges are not allowed"
              violations=1
            fi
          done
          rm -f "$tmp"
          exit $violations

      - &guard-no-dynamic-plugins
        name: "Guard: no dynamic versions in plugin blocks"
        run: |
          set -euo pipefail
          files=$(git ls-files '**/build.gradle' '**/build.gradle.kts' 'settings.gradle' 'settings.gradle.kts' || true)
          [ -z "$files" ] && exit 0

          violations=0
          tmp="$(mktemp)"
          for f in $files; do
            sed -E ':a;/\/\*/{N;/\*\//!ba;s/\/\*.*\*\///g}; s,//.*$,,' "$f" > "$tmp"

            if grep -nE "id([^)]+)[[:space:]]*(\.|)[[:space:]]*version\([[:space:]]*['\"][^'\"]*\+['\"][[:space:]]*\)" "$tmp"; then
              echo "::error file=$f::Dynamic plugin version (+) is not allowed (Kotlin DSL)"
              violations=1
            fi

            if grep -nE "id[[:space:]]+['\"][^'\"]+['\"][[:space:]]+version[[:space:]]+['\"][^'\"]*\+['\"]" "$tmp"; then
              echo "::error file=$f::Dynamic plugin version (+) is not allowed (Groovy DSL)"
              violations=1
            fi

            if grep -nE "version\([[:space:]]*['\"][^'\"]*(latest\.(release|integration))['\"][[:space:]]*\)" "$tmp"; then
              echo "::error file=$f::latest.release/latest.integration are forbidden in plugin DSL"
              violations=1
            fi

            if grep -nE "version\([[:space:]]*['\"][^'\"]*-SNAPSHOT['\"][[:space:]]*\)" "$tmp"; then
              echo "::error file=$f::-SNAPSHOT plugins are not allowed"
              violations=1
            fi

            if grep -nE "version\([[:space:]]*['\"]\[[^'\"]+[\)\]]['\"][[:space:]]*\)" "$tmp"; then
              echo "::error file=$f::Version ranges are not allowed in plugin DSL"
              violations=1
            fi

            if grep -nE "version[[:space:]]+['\"][^'\"]*(latest\.(release|integration))['\"][[:space:]]*" "$tmp"; then
              echo "::error file=$f::latest.release/latest.integration are forbidden in plugin DSL"
              violations=1
            fi

            if grep -nE "version[[:space:]]+['\"][^'\"]*-SNAPSHOT['\"]" "$tmp"; then
              echo "::error file=$f::-SNAPSHOT plugins are not allowed"
              violations=1
            fi

            if grep -nE "version[[:space:]]+['\"]\[[^'\"]+[\)\]]['\"]" "$tmp"; then
              echo "::error file=$f::Version ranges are not allowed in plugin DSL"
              violations=1
            fi
          done
          rm -f "$tmp"
          exit $violations

      - &guard-no-dynamic-catalogs
        name: "Guard: no dynamic versions in version catalogs"
        run: |
          set -euo pipefail
          files=$(git ls-files 'gradle/libs.versions.toml' || true)
          [ -z "$files" ] && exit 0

          violations=0
          for f in $files; do
            matches=$(awk 'BEGIN { }
              /^[[:space:]]*#/ { next }
              /"[^"]*\+[^"]*"/ { printf("%d:%s\n", NR, $0) }
              /"[^"]*latest\.(release|integration)[^"]*"/ { printf("%d:%s\n", NR, $0) }
              /"[^"]*-SNAPSHOT[^"]*"/ { printf("%d:%s\n", NR, $0) }
              /"[^"]*\[[^"]+[)\]][^"]*"/ { printf("%d:%s\n", NR, $0) }
            ' "$f" || true)
            if [ -n "$matches" ]; then
              echo "::error file=$f::Dynamic/snapshot/range versions are not allowed in version catalogs"
              echo "$matches"
              violations=1
            fi
          done

          exit $violations

      - &validate-wrapper
        name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@460a3ca55fc5d559238a0efc7fa9f7465df8585d # v3.3.0

      - &setup-jdk
        name: Set up JDK 21
        uses: actions/setup-java@b36c23c0d998641eff861008f374ee103c25ac73 # v4.4.0
        with:
          distribution: temurin
          java-version: '21'

      - &setup-gradle
        name: Gradle cache & setup
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-disabled: false
          gradle-version: wrapper
          cache-provider: basic
          # The basic provider shares one immutable key across workers. Prime it with the unit/build graph.
          cache-read-only: ${{ github.job != 'unit-tests' || github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - &env-versions
        name: Env versions
        run: |
          java -version
          ./gradlew --version

      - &guard-no-project-repositories
        name: "Guard: no project-level repositories"
        run: |
          ./scripts/retry-command.sh --maven-429 ./gradlew help \
            --dependency-verification=strict \
            --no-configuration-cache \
            --no-build-cache \
            --console=plain

      # These tasks share the H2 test results in one Gradle graph. PG uses
      # a separate profile because runIT also changes the Flyway locations.
      - name: Build, H2 tests, coverage and logs policy
        env:
          CI: "true"
          TELEGRAM_BOT_TOKEN: 111111:TEST_BOT_TOKEN
          NOTIFICATIONS_ENABLED: "false"
          FLYWAY_LOCATIONS: classpath:db/migration/h2
        run: >-
          ./gradlew build coverageGate :app-bot:checkLogsPolicy ktlintCheck detektGate
          dependencyGuard verifyResolvedProductionDependencyGraph
          -PktorEnforcedVersion=3.3.1 --dependency-verification=strict
          --no-configuration-cache --console=plain --stacktrace

      - name: Upload H2, coverage and logs policy reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: jvm-test-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/jacoco/**
            **/build/reports/ktlint/**
            **/build/reports/detekt/**
            app-bot/build/reports/logs-policy/**
          if-no-files-found: ignore

  integration-tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [application, data-client, data-other]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=60000"

    services:
      postgres:
        image: postgres:16-alpine@sha256:46258a3eb38adf37e77ca5bd41f93ca8b1034f925cf37190a7a8015ba151f3ca
        ports: [ "5432:5432" ]
        env:
          POSTGRES_DB: botdb
          POSTGRES_USER: botuser
          POSTGRES_PASSWORD: botpass
        options: >-
          --health-cmd "pg_isready -U botuser -d botdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - *checkout
      - *guard-no-dynamic-versions
      - *guard-no-dynamic-plugins
      - *guard-no-dynamic-catalogs
      - *validate-wrapper
      - *setup-jdk
      - *setup-gradle
      - *env-versions
      - *guard-no-project-repositories

      - name: Wait for Postgres (5432)
        run: |
          for i in {1..60}; do
            nc -z 127.0.0.1 5432 && echo "postgres OK" && exit 0
            sleep 1
          done
          echo "postgres not ready" && exit 1

      - name: Run PostgreSQL integration profile
        env:
          CI: "true"
          PG_SHARD: ${{ matrix.shard }}
        # Test tasks must execute, even when compilation is cached. Each runner owns its database.
        run: |
          started=$(python3 -c 'import time; print(time.time_ns())')
          module=core-data
          check_xml=--verify-junit-xml
          tasks=(:core-data:test --rerun "-PciPostgresShard=$PG_SHARD")
          case "$PG_SHARD" in
            application)
              # Keep the alternate Flyway profile for app-bot and include all other/new JVM modules.
              tasks=(test --rerun -x :core-data:test)
              module=app-bot
              suite=com.example.bot.tools.BootstrapValidatePostgresIT
              cases=('PostgreSQL 16 validation preserves full dump on positive and negative evidence')
              ;;
            data-client)
              check_xml=--verify-junit-case
              suite=com.example.bot.data.client.onboarding.BookingCutoverFencePostgresIT
              cases=('protected seating excludes direct legacy HOLD and createBooked')
              ;;
            data-other)
              suite=com.example.bot.data.migration.FlywayPostgresSmokeTest
              cases=('postgres migrations run with jsonb defaults' 'postgres atomic refund migration preserves legacy actions')
              ;;
            *) echo 'Unknown PostgreSQL test shard' >&2; exit 1 ;;
          esac
          ./gradlew "${tasks[@]}" -PrunIT=true --dependency-verification=strict --no-configuration-cache --console=plain --stacktrace
          python3 scripts/validate-payment-hardening.py "$check_xml" \
            "$module/build/test-results/test/TEST-${suite}.xml" "$suite" "$started" "${cases[@]}"
          python3 -I -S -B scripts/verify-postgres-skips.py "$PG_SHARD" "$started"

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: integration-test-reports-${{ matrix.shard }}
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

  tests-required:
    if: always()
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require H2 and PostgreSQL checks to succeed
        env:
          TESTS_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os

          expected = {"unit-tests", "integration-tests"}
          needs = json.loads(os.environ["TESTS_NEEDS_JSON"])
          if not isinstance(needs, dict) or set(needs) != expected:
              raise SystemExit("tests gate: missing or unexpected worker")
          failed = [name for name in sorted(expected) if not isinstance(needs[name], dict) or needs[name].get("result") != "success"]
          if failed:
              raise SystemExit("tests gate: workers did not succeed: " + ", ".join(failed))
          print("tests gate: every mandatory worker succeeded")
          PYTHON

  amd64-runtime-prototype:
    if: github.event_name == 'workflow_dispatch' && github.workflow_ref == format('koteev-m/clubs_bot/.github/workflows/tests.yml@{0}', github.ref)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout dispatched bytes
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check candidate preparation recipe
        run: python3 -I -S -B scripts/tests/linux-semantic/native-adapter/ci/test-recipe.py
      - name: Obtain and reconstruct exact public inputs
        # Future explicit network/image-build permission; not part of local authorization.
        run: >-
          python3 -I -S -B scripts/tests/linux-semantic/native-adapter/ci/prepare-native-inputs.py
          "${{ runner.temp }}/clb91-adapter-inputs" --authorized-external-preparation
      - name: Native synthetic adapter test
        # Driver invokes only the fixed static helper with separately approved namespace authority.
        run: >-
          python3 -I -S -B scripts/tests/linux-semantic/native-adapter/tests/native-driver.py
          --runtime-tar "${{ runner.temp }}/clb91-adapter-inputs/runtime/native/rootfs.tar"
          --work "${{ runner.temp }}/clb91-native-adapter" --authorized-native-test
      - name: Native isolated semantic helper
        run: >-
          python3 -I -S -B scripts/tests/linux-semantic/isolated-helper/native-ci.py
          --prepared "${{ runner.temp }}/clb91-adapter-inputs"
          --output "${{ runner.temp }}/clb191-isolated-helper"
      - name: Native trusted snapshot handoff
        run: >-
          python3 -I -S -B scripts/tests/linux-semantic/isolated-helper/native-handoff-ci.py
          --prepared "${{ runner.temp }}/clb91-adapter-inputs"
          --output "${{ runner.temp }}/clb192-handoff"
      - name: Native namespace capture to isolated normalizer
        # Synthetic-only, fixed one-shot namespace setup; separate run authorization.
        timeout-minutes: 15
        run: >-
          python3 -I -S -B scripts/tests/linux-semantic/namespace-bootstrap/native-ci.py
          --prepared "${{ runner.temp }}/clb91-adapter-inputs"
          --output "${{ runner.temp }}/clb195-namespace"
      - name: Check synthetic evidence allowlist and size
        if: always()
        id: evidence
        run: >-
          python3 -I -S -B scripts/tests/linux-semantic/native-adapter/ci/check-artifacts.py
          "${{ runner.temp }}"
      - name: Upload bounded synthetic adapter evidence
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: clb91-native-adapter-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/clb91-adapter-inputs/evidence/status.json
            ${{ runner.temp }}/clb91-native-adapter/evidence/environment.json
            ${{ runner.temp }}/clb91-native-adapter/evidence/result.json
            ${{ runner.temp }}/clb91-native-adapter/evidence/commands.json
            ${{ runner.temp }}/clb91-native-adapter/evidence/compiler.json
            ${{ runner.temp }}/clb191-isolated-helper/result.json
            ${{ runner.temp }}/clb192-handoff/result.json
            ${{ runner.temp }}/clb195-namespace/result.json
