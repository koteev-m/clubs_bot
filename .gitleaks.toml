title = "clubs_bot secret scan with verified runtime checksum exceptions"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "CLB-91: exact SHA-256 of two pinned Python runtime files"
condition = "AND"
paths = ['''^scripts/deploy/stage-compose-env-semantic-runtime\.json$''']
regexTarget = "line"
regexes = [
  '''^\s*"/usr/lib/python3\.12/__pycache__/[s]ecrets\.cpython-312\.pyc": "08cd4dd20cb98e58ed935d9353928e74a80b17ea3412a9d6009431249cefbff6",$''',
  '''^\s*"/usr/lib/python3\.12/[s]ecrets\.py": "277000574358a6ecda4bb40e73332ae81a3bc1c8e1fa36f50e5c6a7d4d3f0f17",$''',
]

[[rules.allowlists]]
description = "CLB-91: exact SHA-256 of two amd64 test-candidate Python files"
condition = "AND"
paths = ['''^scripts/tests/linux-semantic/amd64-runtime-candidate\.json$''']
regexTarget = "line"
regexes = [
  '''^\s*"/usr/lib/python3\.12/__pycache__/[s]ecrets\.cpython-312\.pyc": "08cd4dd20cb98e58ed935d9353928e74a80b17ea3412a9d6009431249cefbff6",$''',
  '''^\s*"/usr/lib/python3\.12/[s]ecrets\.py": "277000574358a6ecda4bb40e73332ae81a3bc1c8e1fa36f50e5c6a7d4d3f0f17",$''',
]

[[rules.allowlists]]
description = "CLB-91: exact SHA-256 of two archived ARM64 reference Python files"
condition = "AND"
paths = ['''^scripts/tests/linux-semantic/arm64-runtime-reference\.json$''']
regexTarget = "line"
regexes = [
  '''^\s*"/usr/lib/python3\.12/__pycache__/[s]ecrets\.cpython-312\.pyc": "08cd4dd20cb98e58ed935d9353928e74a80b17ea3412a9d6009431249cefbff6",$''',
  '''^\s*"/usr/lib/python3\.12/[s]ecrets\.py": "277000574358a6ecda4bb40e73332ae81a3bc1c8e1fa36f50e5c6a7d4d3f0f17",$''',
]

[[rules.allowlists]]
description = "CLB-120: exact SHA-256 of accepted runtime files"
condition = "AND"
paths = ['''^scripts/tests/linux-semantic/native-adapter/ci/reference/accepted-manifest\.json$''']
